<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast-UTCI Analysis Viewer</title>
    <script>
        // Auto-redirect to viewer.html
        window.location.href = 'viewer.html';
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .analysis-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .analysis-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .analysis-card h3 {
            color: #333;
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .analysis-info {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .analysis-info strong {
            color: #333;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .badge-single {
            background: #4CAF50;
            color: white;
        }
        
        .badge-fullday {
            background: #FF9800;
            color: white;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 40px;
        }
        
        .error {
            background: #f44336;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 40px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌡️ Fast-UTCI Analysis Viewer</h1>
        <p>Select an analysis to visualize UTCI thermal comfort data</p>
    </div>
    
    <div class="container">
        <div id="analysis-list" class="analysis-grid">
            <div class="loading">Loading available analyses...</div>
        </div>
    </div>
    
    <div class="footer">
        <p>Fast-UTCI - Rapid 2D UTCI Map Computation | Powered by Three.js</p>
    </div>
    
    <script type="module">
        /**
         * Load and display available analyses
         */
        async function loadAnalyses() {
            const container = document.getElementById('analysis-list');
            
            try {
                // Fetch list of available analyses
                // In a real deployment, this would query a backend API or scan a directory
                // For now, we'll try to load from a manifest file
                const response = await fetch('../data/analyses/manifest.json').catch(() => null);
                
                let analyses = [];
                
                if (response && response.ok) {
                    const manifest = await response.json();
                    analyses = manifest.analyses;
                } else {
                    // Fallback: Try to load a few known analyses
                    console.log('[INFO] No manifest found, using fallback list');
                    analyses = [
                        {
                            id: '20250815_grid_10m_single_h13',
                            title: 'August 15, 2025 - 13:00 (10m grid)',
                            type: 'single_hour',
                            date: '2025-08-15',
                            grid_size: '10m',
                            hour: 13
                        },
                        {
                            id: '20250815_grid_10m_fullday',
                            title: 'August 15, 2025 - Full Day (10m grid)',
                            type: 'full_day',
                            date: '2025-08-15',
                            grid_size: '10m'
                        }
                    ];
                }
                
                // Display analyses
                if (analyses.length === 0) {
                    container.innerHTML = `
                        <div class="error">
                            <h3>No analyses found</h3>
                            <p>Please run quick_analysis.py or run_analysis.py to generate analysis data</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '';
                
                for (const analysis of analyses) {
                    const card = createAnalysisCard(analysis);
                    container.appendChild(card);
                }
                
            } catch (error) {
                console.error('[ERROR] Failed to load analyses:', error);
                container.innerHTML = `
                    <div class="error">
                        <h3>Error loading analyses</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        /**
         * Create analysis card element
         */
        function createAnalysisCard(analysis) {
            const card = document.createElement('div');
            card.className = 'analysis-card';
            card.onclick = () => openViewer(analysis.id);
            
            const badgeClass = analysis.type === 'single_hour' ? 'badge-single' : 'badge-fullday';
            const badgeText = analysis.type === 'single_hour' ? 'Single Hour' : 'Full Day (24h)';
            
            let hourInfo = '';
            if (analysis.type === 'single_hour' && analysis.hour !== undefined) {
                hourInfo = `<strong>Hour:</strong> ${analysis.hour}:00<br>`;
            }
            
            card.innerHTML = `
                <h3>${analysis.title || analysis.id}</h3>
                <div class="analysis-info">
                    <strong>Date:</strong> ${analysis.date || 'N/A'}<br>
                    <strong>Grid Size:</strong> ${analysis.grid_size || 'N/A'}<br>
                    ${hourInfo}
                    <strong>Type:</strong> <span class="badge ${badgeClass}">${badgeText}</span>
                </div>
            `;
            
            return card;
        }
        
        /**
         * Open viewer with selected analysis
         */
        function openViewer(analysisId) {
            window.location.href = `viewer.html?analysis=${analysisId}`;
        }
        
        // Load analyses when page loads
        window.addEventListener('DOMContentLoaded', loadAnalyses);
    </script>
</body>
</html>
