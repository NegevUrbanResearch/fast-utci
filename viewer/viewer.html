<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTCI Viewer - Fast-UTCI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #f0f0f0;
        }
        
        #viewer-container {
            width: 100vw;
            height: 100vh;
        }
        
        canvas {
            display: block;
        }
        
        .button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .button:hover {
            background: #1976D2;
        }
        
        #screenshot-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
    </style>
    <link rel="stylesheet" href="css/viewer.css">
    <!-- Shoelace Switch (for legend color scale toggle) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/components/switch/switch.js"></script>
</head>
<body>
    <div id="viewer-container"></div>
    
    <!-- Scenario Selection Panel -->
    <div id="scenario-panel" class="scenario-panel">
        <button id="scenario-toggle" class="scenario-toggle">
            Select Scenario ▼
        </button>
        <div id="scenario-content" class="scenario-content collapsed">
            <select id="scenario-category" class="scenario-dropdown">
                <option value="">Choose Category...</option>
                <option value="existing_buildings">Existing Buildings</option>
                <option value="existing_trees">Existing Trees</option>
                <option value="new_high_buildings">New High Buildings</option>
                <option value="new_low_buildings">New Low Buildings</option>
                <option value="new_trees">New Trees</option>
            </select>
            
            <div id="scenario-variant-control" class="scenario-variant" style="display: none;">
                <label for="scenario-slider">Variant:</label>
                <input type="range" id="scenario-slider" min="1" max="10" value="1" step="1">
                <span id="scenario-number">1</span>
            </div>
        </div>
    </div>
    
    <!-- Layer Controls Panel -->
    <div id="layer-controls" class="panel">
        <div style="font-weight: bold; margin-bottom: 10px; font-size: 13px;">Model Layers</div>
        <div class="layer-controls">
            <div class="layer-item" data-layer="building" data-visible="true">
                <div class="layer-color buildings"></div>
                <div class="layer-label">Buildings</div>
            </div>
            <div class="layer-item" data-layer="road" data-visible="false">
                <div class="layer-color roads"></div>
                <div class="layer-label">Roads</div>
            </div>
            <div class="layer-item" data-layer="vegetation" data-visible="true">
                <div class="layer-color vegetation"></div>
                <div class="layer-label">Vegetation</div>
            </div>
            <div class="layer-item" data-layer="base" data-visible="false">
                <div class="layer-color base"></div>
                <div class="layer-label">Base</div>
            </div>
            <div class="layer-item active" data-layer="utci" data-visible="true">
                <div class="layer-color utci"></div>
                <div class="layer-label">UTCI Data</div>
            </div>
        </div>
    </div>
    
    <!-- Import maps for ES modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Main application script -->
    <script type="module">
        import { initFromURL } from './js/ViewerApp.js';
        
        // Initialize viewer when page loads
        window.addEventListener('DOMContentLoaded', () => {
            initFromURL();
            
            // Setup scenario controls
            const toggleBtn = document.getElementById('scenario-toggle');
            const content = document.getElementById('scenario-content');
            const categorySelect = document.getElementById('scenario-category');
            const variantControl = document.getElementById('scenario-variant-control');
            const slider = document.getElementById('scenario-slider');
            const numberDisplay = document.getElementById('scenario-number');
            
            // Toggle collapse/expand
            toggleBtn.addEventListener('click', () => {
                content.classList.toggle('collapsed');
                toggleBtn.textContent = content.classList.contains('collapsed') 
                    ? 'Select Scenario ▼' 
                    : 'Select Scenario ▲';
            });
            
            // Show variant selector when category is chosen and auto-load variant 1
            categorySelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    variantControl.style.display = 'flex';
                    slider.value = 1;
                    numberDisplay.textContent = '1';
                    
                    // Auto-load variant 1
                    if (window.viewerApp) {
                        window.viewerApp.loadScenario(e.target.value, 1);
                    }
                } else {
                    variantControl.style.display = 'none';
                }
            });
            
            // Update on slider drag (real-time) - more responsive
            slider.addEventListener('input', (e) => {
                numberDisplay.textContent = e.target.value;
                
                const category = categorySelect.value;
                const variant = parseInt(e.target.value);
                if (category && window.viewerApp) {
                    window.viewerApp.loadScenario(category, variant);
                }
            });
        });
        
        // Screenshot function - save to clipboard with fallback to download
        window.takeScreenshot = function() {
            const canvas = document.querySelector('canvas');
            if (!canvas) {
                alert('Canvas not found');
                return;
            }
            
            // Convert canvas to blob and copy to clipboard
            canvas.toBlob((blob) => {
                if (blob && navigator.clipboard && window.ClipboardItem) {
                    // Try to copy to clipboard first
                    navigator.clipboard.write([
                        new ClipboardItem({
                            'image/png': blob
                        })
                    ]).then(() => {
                        console.log('[SCREENSHOT] Image copied to clipboard!');
                        // Show brief success feedback
                        const btn = document.getElementById('screenshot-btn');
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '✅ Copied!';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                        }, 1500);
                    }).catch(err => {
                        console.warn('[SCREENSHOT] Clipboard failed, falling back to download:', err);
                        downloadScreenshot(blob);
                    });
                } else {
                    console.log('[SCREENSHOT] Clipboard API not available, downloading...');
                    downloadScreenshot(blob);
                }
            }, 'image/png');
        };
        
        // Fallback download function
        function downloadScreenshot(blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `utci_screenshot_${new Date().getTime()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
