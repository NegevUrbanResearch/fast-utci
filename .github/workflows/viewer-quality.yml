name: Viewer quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  viewer-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck viewer
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Build viewer
        run: npm run build
