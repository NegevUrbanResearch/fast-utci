name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      
      - name: Install dependencies
        working-directory: viewer
        run: npm ci
      
      # Temporarily disabled due to vite-plugin-svelte v6 incompatibility with vitest's embedded Vite
      # TODO: Re-enable after fixing vitest configuration or updating dependencies
      # - name: Run tests
      #   working-directory: viewer
      #   run: npm test
      
      - name: Build viewer
        working-directory: viewer
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare deployment directory
        run: |
          # Create _site directory
          mkdir -p _site
          # Copy SvelteKit build output directly to root
          cp -r viewer/build/* _site/
          # Copy data directory
          cp -r data _site/
          # Ensure .nojekyll exists for GitHub Pages
          touch _site/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

